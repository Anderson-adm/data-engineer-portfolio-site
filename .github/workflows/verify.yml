name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:links
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Also validate a project subpath
        run: npm run build && npm run test:links && npm test
        env:
          BASE_PATH: /data-engineer-portfolio-site/
          SITE_URL: https://ci-validation.invalid
